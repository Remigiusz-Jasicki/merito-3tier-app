name: CI & Security Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  security-scan:
    name: Security & Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret Scanning (Gitleaks)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source /repo -v

      - name: Vulnerability Scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '1'

  build:
    name: Build Frontend and Backend
    runs-on: ubuntu-latest
    needs: security-scan
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build Frontend
        run: cd frontend && npm ci && npm run build
      - name: Build Backend
        run: cd backend && npm ci && npm test --if-present

  deploy:
    name: Continuous Deployment (CD)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login (Simulated)
        run: |
          echo "Simulating secure connection to Azure cloud..."
          echo "Login successful for student project."

      - name: E3 - Deploy Web (Frontend)
        run: |
          echo "Deploying frontend to Azure Static Web Apps..."
          echo "Build files successfully published!"

      - name: E4 - Deploy App (Backend)
        run: |
          echo "Deploying backend to Azure App Service..."
          echo "Container instance started successfully!"
